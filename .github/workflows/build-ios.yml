name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core tests
        run: |
          mkdir -p logs
          swift test 2>&1 | tee logs/core-tests.log; exit ${PIPESTATUS[0]}
      - name: Unsigned IPA
        run: |
          mkdir -p logs
          ./scripts/build_ipa.sh 2>&1 | tee logs/build-ipa.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: TwoUp-unsigned-ipa
          path: build/TwoUp-unsigned.ipa
      - name: Publish IPA to the ci-builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out && cp build/TwoUp-unsigned.ipa /tmp/out/
          ./scripts/publish_branch.sh ci-builds /tmp/out
      - name: App tests (simulator)
        continue-on-error: true
        run: |
          mkdir -p logs
          ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcodebuild test -project TwoUp.xcodeproj -scheme TwoUp -destination "platform=iOS Simulator,id=$ID" 2>&1 | tee logs/app-tests.log; exit ${PIPESTATUS[0]}
      - name: Publish logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p logs
          ./scripts/publish_branch.sh ci-logs logs
