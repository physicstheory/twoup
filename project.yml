name: TwoUp
options:
  bundleIdPrefix: au.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TwoUpCore:
    path: .
targets:
  TwoUp:
    type: application
    platform: iOS
    sources:
      - TwoUpApp
    dependencies:
      - package: TwoUpCore
    info:
      path: TwoUpApp/Info.plist
      properties:
        CFBundleDisplayName: Two-Up
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: au.example.twoup
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  TwoUpAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TwoUpAppTests
    dependencies:
      - target: TwoUp
      - package: TwoUpCore
schemes:
  TwoUp:
    build:
      targets:
        TwoUp: all
    test:
      targets:
        - TwoUpAppTests
